<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="layout">

        <header>
            <div class="header-left">
                <h1>Chat</h1>
                <span id="model-badge" class="model-badge"></span>
            </div>
            <div class="header-right">
                <button id="clear-btn" class="icon-btn" title="Clear conversation" aria-label="Clear conversation">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4h6v2"/>
                    </svg>
                </button>
                <button id="settings-btn" class="icon-btn" title="Settings" aria-label="Settings">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="3"/>
                        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
                    </svg>
                </button>
            </div>
        </header>

        <!-- Settings modal -->
        <div id="settings-modal" class="modal hidden" role="dialog" aria-modal="true" aria-label="Settings">
            <div class="modal-content">
                <h2>Settings</h2>
                <label for="tunnel-url">
                    Cloudflare Tunnel URL
                    <span class="label-hint">Same URL as your calorie logger tunnel</span>
                    <input type="url" id="tunnel-url" placeholder="https://xxxx-xxxx.trycloudflare.com" autocomplete="off" spellcheck="false">
                </label>
                <label for="model-name">
                    Ollama Model
                    <input type="text" id="model-name" placeholder="llama3.2" autocomplete="off" spellcheck="false">
                </label>
                <label for="system-prompt">
                    System Prompt
                    <span class="label-hint">Defines how the assistant behaves</span>
                    <textarea id="system-prompt" rows="6" placeholder="You are a helpful assistant..."></textarea>
                </label>
                <div class="modal-actions">
                    <button id="save-settings" class="btn primary">Save</button>
                    <button id="close-settings" class="btn">Cancel</button>
                </div>
            </div>
        </div>

        <!-- Messages -->
        <main id="messages" class="messages" aria-live="polite" aria-label="Conversation">
            <div class="welcome" id="welcome">
                <p>Start a conversation below.</p>
                <p class="welcome-hint">Enter to send &nbsp;·&nbsp; Shift+Enter for new line</p>
            </div>
        </main>

        <!-- Input bar -->
        <div class="input-bar">
            <textarea
                id="user-input"
                class="user-input"
                placeholder="Message..."
                rows="1"
                aria-label="Message input"
            ></textarea>
            <button id="send-btn" class="send-btn" aria-label="Send">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="22" y1="2" x2="11" y2="13"/>
                    <polygon points="22 2 15 22 11 13 2 9 22 2"/>
                </svg>
            </button>
        </div>

    </div>

    <script src="app.js"></script>
</body>
</html>
